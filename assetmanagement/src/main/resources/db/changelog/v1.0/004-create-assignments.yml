databaseChangeLog:
  - changeSet:
      id: create-assignments-004
      author: ibrahim
      changes:
        - createTable:
            tableName: asset_assignments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assignment_asset
                    references: assets(id)
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assignment_employee
                    references: employees(id)
              - column:
                  name: assigned_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: DATE
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: condition
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: asset_assignments
            indexName: idx_assignments_asset_id
            columns:
              - column:
                  name: asset_id
        - createIndex:
            tableName: asset_assignments
            indexName: idx_assignments_employee_id
            columns:
              - column:
                  name: employee_id