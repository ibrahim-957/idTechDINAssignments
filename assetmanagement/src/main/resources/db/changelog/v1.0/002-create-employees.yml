databaseChangeLog:
  - changeSet:
      id: create-employees-002
      author: ibrahim
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_employee_department
                    references: departments(id)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: employees
            indexName: idx_employees_department_id
            columns:
              - column:
                  name: department_id
        - createIndex:
            tableName: employees
            indexName: idx_employees_email
            columns:
              - column:
                  name: email