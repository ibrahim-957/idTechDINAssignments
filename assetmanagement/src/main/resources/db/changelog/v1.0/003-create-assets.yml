databaseChangeLog:
  - changeSet:
      id: create-assets-003
      author: ibrahim
      changes:
        - createTable:
            tableName: assets
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: serial_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false
              - column:
                  name: purchase_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: purchase_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: assets
            indexName: idx_assets_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: assets
            indexName: idx_assets_type
            columns:
              - column:
                  name: type